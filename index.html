<title>Who Sees This Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed live street model (soft white study model, Claude-orange cutouts on anything that records); header top-left, controls bottom, details panel on the right (bottom sheet on phones). Deliberately single light theme. */
:root{
  --paper:#ECE9E4;
  --card:#FFFFFF;
  --ink:#1F1D1A;
  --ink-2:#55504A;
  --ink-3:#8A847C;
  --rule:#E6E2DC;
  --clay:#D97757;       /* Claude orange: every recording system */
  --clay-soft:#FBEDE7;
  --flag:#B54708;
  --flag-bg:#FFF4E8;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5}
#head{top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));max-width:min(400px,calc(100vw - 32px));pointer-events:none}
#head > *{pointer-events:auto}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--clay)}
h1{font:700 clamp(22px,3vw,30px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub-h{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.lede{font-size:14px;line-height:1.5;color:var(--ink-2);margin:0;max-width:38ch}
.stats{display:flex;gap:18px;margin-top:14px;font-variant-numeric:tabular-nums}
.stat b{display:block;font:600 22px/1 var(--f-display)}
.stat span{font:500 11px/1.3 var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.note-loc{font:400 11px/1.45 var(--f-mono);color:var(--ink-3);margin:12px 0 0;max-width:44ch}

#dock{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.pill{font:500 12px/1 var(--f-body);display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--rule);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer}
.pill:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#legend{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;max-width:min(320px,calc(100vw - 32px))}
#legend summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
#legend summary::-webkit-details-marker{display:none}
#legend summary::after{content:"+";margin-left:auto;color:var(--ink-3)}
#legend[open] summary{margin-bottom:8px}
#legend[open] summary::after{content:"–"}
#legend summary:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
#legend ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#legend li button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;font-size:13px;line-height:1.3;padding:6px 8px;border-radius:7px}
#legend li button:hover,#legend li button[aria-pressed="true"]{background:var(--clay-soft)}
#legend li button:focus-visible{outline:2px solid var(--clay)}
#legend li small{font:500 11px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap}
#hint{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font:500 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;pointer-events:none}

#tip{position:fixed;z-index:7;left:0;top:0;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:8px;font:500 12px/1.3 var(--f-body);white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(31,29,26,.2)}
#tip small{display:block;font:400 11px/1.3 var(--f-mono);color:#E9B9A6;margin-top:2px}
#tip.on{opacity:1}

#panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(400px,calc(100vw - 24px));background:var(--card);border:1px solid var(--rule);border-radius:18px;box-shadow:0 24px 60px rgba(31,29,26,.14);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.p-top{padding:18px 20px 14px;border-bottom:1px solid var(--rule);position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--clay-soft);color:#9A4A2E}
.p-top h2{font:700 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:10px 0 6px;text-wrap:balance;padding-right:30px}
.p-top p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#tabs button{font:500 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink-2);cursor:pointer}
#tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#tabs button:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:#fff;cursor:pointer;font:500 18px/1 var(--f-body);color:var(--ink-2)}
#close:focus-visible{outline:2px solid var(--clay)}
.p-body{overflow-y:auto;padding:4px 20px 20px;flex:1;min-height:0}
.sec{padding:14px 0;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec h3{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.list{margin:0;padding-left:18px;font-size:13px;line-height:1.5;display:grid;gap:3px}
.txt{font-size:13px;line-height:1.55;color:var(--ink-2);margin:0}
.sub{font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 6px}
.sub:first-child{margin-top:0}
.ret{display:grid;gap:6px}
.ret div{display:grid;gap:3px;padding:8px 10px;border-radius:9px;background:#F6F4F1}
.ret span{font-size:12px;line-height:1.4;color:var(--ink-3)}
.ret b{font:600 13px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.flags{display:grid;gap:6px}
.flags div{font-size:12.5px;line-height:1.45;padding:8px 10px 8px 30px;border-radius:9px;background:var(--flag-bg);color:#7A3306;position:relative}
.flags div::before{content:"!";position:absolute;left:10px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--flag);color:#fff;font:700 10px/14px var(--f-mono);text-align:center}
blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--clay);font-size:12.5px;line-height:1.5;color:var(--ink-2);font-style:italic;background:#FBF8F5;border-radius:0 8px 8px 0}
.src{display:inline-block;margin-top:10px;font:500 12px/1.4 var(--f-mono);color:#B4532F}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:600 13px/1 var(--f-body);padding:11px 10px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#draftTo{font-size:12px;line-height:1.45;color:var(--ink-2);margin:10px 0 6px}
#draftText{width:100%;box-sizing:border-box;min-height:200px;font:400 12px/1.5 var(--f-mono);border:1px solid var(--rule);border-radius:9px;padding:10px;resize:vertical;color:var(--ink);background:#FBFAF8}
#copy{margin-top:6px}
.note{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.ico{width:15px;height:15px;flex:none;vertical-align:-3px}
.chip .ico{width:13px;height:13px;vertical-align:-2px}
.sec h3{display:flex;align-items:center;gap:7px}
.sec h3 .ico{color:var(--clay);width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.p-top .srclink{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:500 12px/1.3 var(--f-body);color:#B4532F;text-decoration:none}
.p-top .srclink:hover{text-decoration:underline}
.p-top .srclink .ico{width:12px;height:12px}
details.more{padding:12px 0 0}
details.more summary{cursor:pointer;font:600 12px/1 var(--f-body);color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font:500 14px/1 var(--f-mono);color:var(--ink-3);width:12px}
details.more[open] summary::before{content:"–"}
details.more summary:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
details.more .sec:first-of-type{padding-top:10px}
.lg-ico{color:var(--clay);display:inline-flex}
#legend li button > span:first-child{display:inline-flex;align-items:center;gap:8px}

@media (max-width:720px){
  #panel{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:64%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateY(calc(100% + 24px))}
  .lede,.note-loc,#hint,#legend{display:none}
}
@media (prefers-reduced-motion:reduce){ #panel{transition:none} }
</style>

const CYCLE=[['mission','g',14],['mission','y',2.6],['all','r',2.6],['sixteenth','g',11],['sixteenth','y',2.6],['all','r',2.6]];
const CYCLE_LEN = CYCLE.reduce((a,c)=>a+c[2],0);
let simT = 3, paused = false;
function phaseAt(t){ t%=CYCLE_LEN; for(const c of CYCLE){ if(t<c[2]) return c; t-=c[2]; } return CYCLE[0]; }
function lightFor(sig,ph){ return ph[0]===sig ? ph[1] : 'r'; }
function paintSignals(ph){

}
function placeOnLane(l,v){
  const pos = v.s*l.dir;
  if (l.axis==='z'){ v.obj.position.set(l.c,0,pos); v.obj.rotation.y = l.dir>0 ? -Math.PI/2 : Math.PI/2; }
  else { v.obj.position.set(pos,0,l.c); v.obj.rotation.y = l.dir>0 ? 0 : Math.PI; }
}
function stepTraffic(dt,ph){
  const occ={mission:false,sixteenth:false};
  for (const l of lanes){ const half=l.axis==='z'?SZ:MX; for (const v of l.v) if (v.s+v.len/2>-half && v.s-v.len/2<half) occ[l.sig]=true; }
  for (const l of lanes){
    const other = l.sig==='mission'?'sixteenth':'mission';
    const vs=l.v; vs.sort((a,b)=>a.s-b.s);
    const st=lightFor(l.sig,ph);
    vs.forEach((v,i)=>{
      const lead = vs.length>1 ? vs[(i+1)%vs.length] : null;
      let target=v.vmax;
      if (lead){ let ls=lead.s; if (ls<=v.s) ls+=2*HALF; const gap=(ls-lead.len/2)-(v.s+v.len/2); target=Math.min(target,Math.max(0,(gap-2.2)*.9)); }
      const front=v.s+v.len/2, dist=l.stop-front;
      const mustStop = (st!=='g' && !(st==='y' && dist<3.5)) || occ[other];
      if (mustStop && dist>-.2 && dist<26) target=Math.min(target,Math.max(0,dist*.75));
      v.speed += THREE.MathUtils.clamp(target-v.speed,-7*dt,2.4*dt);
      v.s += v.speed*dt; if (v.s>HALF) v.s-=2*HALF;
      placeOnLane(l,v);
    });
  }
  for (const p of peds){
    const nx = p.s + p.dir*p.v*dt;
    const inside = q => Math.abs(q) < p.p.cross+.3;
    if (!(!inside(p.s) && inside(nx) && lightFor(p.p.sig,ph)!=='g')){ p.s = nx; if (p.s>HALF) p.s-=2*HALF; if (p.s<-HALF) p.s+=2*HALF; p.ph += dt*7; }
    const bob = Math.abs(Math.sin(p.ph))*.06;
    if (p.p.axis==='z') p.obj.position.set(p.p.c,.18+bob,p.s); else p.obj.position.set(p.s,.18+bob,p.p.c);
  }
}

  if (f.audit) M.push(`<div class="sec"><h3>Oversight</h3><p class="txt">${esc(f.audit)}</p></div>`);
  if (gaps.length>2) M.push(`<div class="sec"><h3>More gaps</h3><div class="flags">${gaps.slice(2).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`);
  if (f.quote) M.push(`<div class="sec"><h3>From the policy</h3><blockquote>“${esc(f.quote)}”</blockquote></div>`);
  if (M.length) H.push(`<details class="more"><summary>More from the policy</summary>${M.join('')}</details>`);
  const body=document.getElementById('pBody'); body.innerHTML=H.join(''); body.scrollTop=0;
  document.getElementById('bComment').onclick=()=>draft('comment',sys);
  document.getElementById('bRecords').onclick=()=>draft('records',sys);
  document.getElementById('copy').onclick=copyDraft;
}
function closePanel(){ panel.classList.remove('open'); current=null; if (autoPaused){ paused=false; autoPaused=false; syncPause(); } outlineFocus.selectedObjects=hover!=null?[HOSTS[hover].obj]:[]; for (const k in cones) cones[k].forEach(c=>c.visible=false); HOSTS.forEach(x=>x.leg.setAttribute('aria-pressed','false')); }
document.getElementById('close').onclick=closePanel;
addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

function draft(kind,sys){
  const f=factBy(sys.policy), src=SOURCES[sys.policy];
  const name=`${f.department||'the department'} ${src?src.label:sys.title} Surveillance Technology Policy`;
  const gaps=f.vague_or_missing||[];
  let to,text;
  if (kind==='comment'){
    to='Send as public comment to the Committee on Information Technology (COIT) or the Board of Supervisors when this policy is heard. Meeting pages: sf.gov/departments--council-information-technology-coit';
    text=`To the Committee on Information Technology and the Board of Supervisors:\n\nI live in San Francisco and I am commenting on the ${name}.\n\n`+
      (gaps.length?`The policy leaves the following unclear or unstated:\n${gaps.map(g=>`- ${g}`).join('\n')}\n\n`:'')+
      `I ask that the policy state each of these plainly, including how long each kind of data is kept and every outside party that receives it, before it is next approved or amended.\n\nThank you,\n[Your name]\n[Your neighborhood]`;
  } else {
    const ext=f.shared_external||[];
    to=`Send to ${f.department||'the department'}'s public records contact as a request under the SF Sunshine Ordinance and the California Public Records Act.`;
    text=`To the ${f.department||'department'} custodian of records:\n\nUnder the San Francisco Sunshine Ordinance (Admin Code Ch. 67) and the California Public Records Act, I request copies of:\n\n`+
      `1. The most recent annual surveillance report for the ${src?src.label:sys.title} system.\n`+
      `2. Any audit logs or audit summaries showing who accessed this system's data in the last 12 months.\n`+
      `3. Records showing data disposal under the policy's retention schedule.\n`+
      (ext.length?`4. Current contracts or data-sharing agreements with: ${ext.join('; ')}.\n`:`4. Any data-sharing agreements covering this system's data.\n`)+
      `5. Any requests for this data from agencies outside the City and County of San Francisco, and the responses.\n\nElectronic copies are fine. Please tell me if any part of this request is unclear.\n\nThank you,\n[Your name]\n[Contact]`;
  }
  document.getElementById('draftTo').textContent=to;
  document.getElementById('draftText').value=text;
  document.getElementById('copyNote').textContent='';
  document.getElementById('draft').hidden=false;
}
function copyDraft(){
  const ta=document.getElementById('draftText'), note=document.getElementById('copyNote');
  navigator.clipboard.writeText(ta.value).then(()=>{note.textContent='Copied.';}).catch(()=>{ta.select(); note.textContent='Selected. Press Ctrl+C or ⌘C to copy.';});
}

/* ================= picking + hover ================= */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(), tip=document.getElementById('tip');
const pickables=[]; HOSTS.forEach(h=>h.obj.traverse(o=>{ if(o.isMesh && !o.userData.cone) pickables.push(o); }));
let downAt=null; const _hp=new THREE.Vector3();
function hostAt(e){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if (hit) return hit.object.userData.host;
  let best=null, bd=44;
  HOSTS.forEach((h,i)=>{ h.obj.getWorldPosition(_hp); _hp.y=h.obj.userData.vehicle?1.6:4; _hp.project(camera); const sx=(_hp.x+1)/2*r.width+r.left, sy=(1-_hp.y)/2*r.height+r.top; const d=Math.hypot(sx-e.clientX,sy-e.clientY); if (d<bd){bd=d;best=i;} });
  return best;
}
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if (!downAt || Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return;
  const h=hostAt(e); if (h!=null) select(h); else if (current) closePanel();
});
renderer.domElement.addEventListener('pointermove',e=>{
  const h=e.pointerType==='touch'?null:hostAt(e);
  hover = h;
  renderer.domElement.style.cursor = h!=null ? 'pointer' : 'grab';
  if (!current) outlineFocus.selectedObjects = h!=null ? [HOSTS[h].obj] : [];
  if (h!=null){ const H=HOSTS[h]; tip.innerHTML=`${esc(H.name)}<small>${H.keys.length>1?H.keys.length+' recording systems':esc(SYSTEMS[H.keys[0]].kind)} · click to see</small>`; tip.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`; tip.classList.add('on'); }
  else tip.classList.remove('on');
});
renderer.domElement.addEventListener('pointerleave',()=>{ tip.classList.remove('on'); hover=null; if(!current) outlineFocus.selectedObjects=[]; });

const pauseBtn=document.getElementById('pause');
function syncPause(){ pauseBtn.textContent=paused?'Resume traffic':'Pause traffic'; pauseBtn.setAttribute('aria-pressed',paused); }
pauseBtn.onclick=()=>{ paused=!paused; autoPaused=false; syncPause(); };
if (matchMedia('(prefers-reduced-motion: reduce)').matches){ paused=true; pauseBtn.textContent='Resume traffic'; pauseBtn.setAttribute('aria-pressed','true'); }

/* ================= loop ================= */
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h, fr = a<.9 ? FR*1.45 : FR;
  camera.left=-fr*a; camera.right=fr*a; camera.top=fr; camera.bottom=-fr; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false); composer.setSize(w,h);
  fxaa.material.uniforms.resolution.value.set(1/(w*PR),1/(h*PR));
}
addEventListener('resize',resize); resize();
for (let i=0;i<240;i++){ simT+=1/30; stepTraffic(1/30,phaseAt(simT)); }
const clock=new THREE.Clock(); const _ft=new THREE.Vector3(), _fd=new THREE.Vector3(), _fmin=new THREE.Vector3(-34,0,-34), _fmax=new THREE.Vector3(34,0,34);
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  if (!paused){ simT+=dt; stepTraffic(dt,phaseAt(simT)); }
  paintSignals(phaseAt(simT));
  outlineFocus.pulsePeriod = current ? 2.2 : 0;
  if (current){ current.obj.getWorldPosition(_ft); _ft.y=0; _ft.clamp(_fmin,_fmax); _fd.copy(_ft).sub(controls.target).multiplyScalar(.07); if (_fd.lengthSq()>1e-5){ controls.target.add(_fd); camera.position.add(_fd); } }
  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
