<title>Who Sees This Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed live street model (soft white study model, Claude-orange cutouts on anything that records); header top-left, controls bottom, details panel on the right (bottom sheet on phones). Deliberately single light theme. */
:root{
  --paper:#ECE9E4;
  --card:#FFFFFF;
  --ink:#1F1D1A;
  --ink-2:#55504A;
  --ink-3:#8A847C;
  --rule:#E6E2DC;
  --clay:#D97757;       /* Claude orange: every recording system */
  --clay-soft:#FBEDE7;
  --flag:#B54708;
  --flag-bg:#FFF4E8;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5}
#head{top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));max-width:min(400px,calc(100vw - 32px));pointer-events:none}
#head > *{pointer-events:auto}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--clay)}
h1{font:700 clamp(22px,3vw,30px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub-h{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.lede{font-size:14px;line-height:1.5;color:var(--ink-2);margin:0;max-width:38ch}
.stats{display:flex;gap:18px;margin-top:14px;font-variant-numeric:tabular-nums}
.stat b{display:block;font:600 22px/1 var(--f-display)}
.stat span{font:500 11px/1.3 var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.note-loc{font:400 11px/1.45 var(--f-mono);color:var(--ink-3);margin:12px 0 0;max-width:44ch}

#dock{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.pill{font:500 12px/1 var(--f-body);display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--rule);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer}
.pill:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#legend{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;max-width:min(320px,calc(100vw - 32px))}
#legend summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
#legend summary::-webkit-details-marker{display:none}
#legend summary::after{content:"+";margin-left:auto;color:var(--ink-3)}
#legend[open] summary{margin-bottom:8px}
#legend[open] summary::after{content:"–"}
#legend summary:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
#legend ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#legend li button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;font-size:13px;line-height:1.3;padding:6px 8px;border-radius:7px}
#legend li button:hover,#legend li button[aria-pressed="true"]{background:var(--clay-soft)}
#legend li button:focus-visible{outline:2px solid var(--clay)}
#legend li small{font:500 11px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap}
#hint{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font:500 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;pointer-events:none}

#tip{position:fixed;z-index:7;left:0;top:0;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:8px;font:500 12px/1.3 var(--f-body);white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(31,29,26,.2)}
#tip small{display:block;font:400 11px/1.3 var(--f-mono);color:#E9B9A6;margin-top:2px}
#tip.on{opacity:1}

#panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(400px,calc(100vw - 24px));background:var(--card);border:1px solid var(--rule);border-radius:18px;box-shadow:0 24px 60px rgba(31,29,26,.14);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.p-top{padding:18px 20px 14px;border-bottom:1px solid var(--rule);position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--clay-soft);color:#9A4A2E}
.p-top h2{font:700 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:10px 0 6px;text-wrap:balance;padding-right:30px}
.p-top p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#tabs button{font:500 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink-2);cursor:pointer}
#tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#tabs button:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:#fff;cursor:pointer;font:500 18px/1 var(--f-body);color:var(--ink-2)}
#close:focus-visible{outline:2px solid var(--clay)}
.p-body{overflow-y:auto;padding:4px 20px 20px;flex:1;min-height:0}
.sec{padding:14px 0;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec h3{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.list{margin:0;padding-left:18px;font-size:13px;line-height:1.5;display:grid;gap:3px}
.txt{font-size:13px;line-height:1.55;color:var(--ink-2);margin:0}
.sub{font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 6px}
.sub:first-child{margin-top:0}
.ret{display:grid;gap:6px}
.ret div{display:grid;gap:3px;padding:8px 10px;border-radius:9px;background:#F6F4F1}
.ret span{font-size:12px;line-height:1.4;color:var(--ink-3)}
.ret b{font:600 13px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.flags{display:grid;gap:6px}
.flags div{font-size:12.5px;line-height:1.45;padding:8px 10px 8px 30px;border-radius:9px;background:var(--flag-bg);color:#7A3306;position:relative}
.flags div::before{content:"!";position:absolute;left:10px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--flag);color:#fff;font:700 10px/14px var(--f-mono);text-align:center}
blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--clay);font-size:12.5px;line-height:1.5;color:var(--ink-2);font-style:italic;background:#FBF8F5;border-radius:0 8px 8px 0}
.src{display:inline-block;margin-top:10px;font:500 12px/1.4 var(--f-mono);color:#B4532F}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:600 13px/1 var(--f-body);padding:11px 10px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
#draftTo{font-size:12px;line-height:1.45;color:var(--ink-2);margin:10px 0 6px}
#draftText{width:100%;box-sizing:border-box;min-height:200px;font:400 12px/1.5 var(--f-mono);border:1px solid var(--rule);border-radius:9px;padding:10px;resize:vertical;color:var(--ink);background:#FBFAF8}
#copy{margin-top:6px}
.note{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.ico{width:15px;height:15px;flex:none;vertical-align:-3px}
.chip .ico{width:13px;height:13px;vertical-align:-2px}
.sec h3{display:flex;align-items:center;gap:7px}
.sec h3 .ico{color:var(--clay);width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.p-top .srclink{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:500 12px/1.3 var(--f-body);color:#B4532F;text-decoration:none}
.p-top .srclink:hover{text-decoration:underline}
.p-top .srclink .ico{width:12px;height:12px}
details.more{padding:12px 0 0}
details.more summary{cursor:pointer;font:600 12px/1 var(--f-body);color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font:500 14px/1 var(--f-mono);color:var(--ink-3);width:12px}
details.more[open] summary::before{content:"–"}
details.more summary:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
details.more .sec:first-of-type{padding-top:10px}
.lg-ico{color:var(--clay);display:inline-flex}
#legend li button > span:first-child{display:inline-flex;align-items:center;gap:8px}

@media (max-width:720px){
  #panel{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:64%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateY(calc(100% + 24px))}
  .lede,.note-loc,#legend{display:none}
  #hint{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 60px);font-size:10px;line-height:1.35;letter-spacing:0}
}
@media (prefers-reduced-motion:reduce){ #panel{transition:none} }
</style>

<div id="stage" aria-hidden="true"></div>
<div id="tip" role="presentation"></div>

<header id="head" class="hud">
  <h1>Who sees this corner?</h1>
  <p class="sub-h">Mission St &amp; 16th St, San Francisco. Click anything outlined in orange.</p>
</header>

<div id="dock" class="hud">
  <details id="legend">
    <summary>What's recording here</summary>
    <ul id="legendList"></ul>
  </details>
  <button class="pill" id="pause" aria-pressed="false">Pause traffic</button>
  <button class="pill" id="view" aria-pressed="false">Street view</button>
</div>
<div id="hint" class="hud">Device placement is illustrative, not real camera locations · drag to rotate</div>

<aside id="panel" aria-live="polite" aria-label="System details">
  <div class="p-top">
    <span class="chip" id="pCat"></span>
    <h2 id="pName"></h2>
    <p id="pPurpose"></p>
    <div id="tabs" role="tablist" hidden></div>
    <button id="close" aria-label="Close details">×</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/OutlinePass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const FACTS = /*FACTS*/[]/*END*/;
const SOURCES = /*SOURCES*/{}/*END*/;
const factBy = id => FACTS.find(f => f.id === id) || {};
const IC = {
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  plate:'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  video:'<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  map:'<path d="M14.1 4.1 9.9 2 3.6 4.7a1 1 0 0 0-.6.9v15.8l6.9-2.9 4.2 2.1 6.3-2.7a1 1 0 0 0 .6-.9V2.6z"/><path d="M9.9 2v16.5M14.1 4.1v16.5"/>',
  link:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
};
const icon = (n,cls='ico') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const KIND_ICON = {"Traffic enforcement camera":"camera","Plate reader":"plate","Vehicle video":"video"};


// Every recording system. `policy` keys into FACTS.
const SYSTEMS = {
  redlight:{policy:"sfmta_redlight", title:"Red-light camera", kind:"Traffic enforcement camera"},
  speed:{policy:"sfmta_speed", title:"Speed camera", kind:"Traffic enforcement camera"},
  tole:{policy:"sfmta_lpr", title:"Bus lane camera", kind:"Plate reader"},
  bussec:{policy:"sfmta_security", title:"Onboard security cameras", kind:"Vehicle video"},
  busai:{policy:"sfmta_busanalytics", title:"Driver-safety video analytics", kind:"Vehicle video"},
  pco:{policy:"sfmta_lpr", title:"Parking enforcement plate reader", kind:"Plate reader"},
  police:{policy:"sfpd_alpr", title:"Police plate reader", kind:"Plate reader"},
  taxi:{policy:"sfmta_taxi", title:"Taxi dashboard camera", kind:"Vehicle video"}
};

/* ================= renderer, camera, post ================= */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
let PR = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const BG = 0xECE9E4;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
// soft daytime sky: gradient, sun glow and drifting clouds; only drawn in street view
const sky = new THREE.Mesh(new THREE.SphereGeometry(140,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{uSun:{value:new THREE.Vector3(-30,60,24).normalize()}, uTime:{value:0}},
  vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position); vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position=p; gl_Position.z=p.w*.9999; }`,
  fragmentShader:`uniform vec3 uSun; uniform float uTime; varying vec3 vDir;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
  float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
  void main(){
    vec3 d=normalize(vDir); float h=d.y;
    vec3 zen=vec3(.40,.60,.86), mid=vec3(.64,.78,.93), hor=vec3(.95,.92,.88);
    vec3 col=mix(hor,mid,smoothstep(0.,.22,h)); col=mix(col,zen,smoothstep(.22,.95,h));
    float s=max(dot(d,uSun),0.);
    col+=vec3(1.,.86,.66)*(pow(s,6.)*.16+pow(s,80.)*.4)+vec3(1.,.96,.88)*smoothstep(.9993,.9996,s);
    if(h>0.){ vec2 uv=d.xz/(h+.12)*1.3+vec2(uTime*.008,uTime*.003); float c=smoothstep(.5,.8,fbm(uv)); c*=smoothstep(.0,.2,h); col=mix(col,vec3(1.,.99,.97),c*.85); }
    gl_FragColor=vec4(col,1.);
  }`
}));
sky.renderOrder=-1; sky.frustumCulled=false; sky.visible=false; scene.add(sky);
const haze = new THREE.Fog(0xF2EBE0, 60, 165);

const FR = 17;
const camera = new THREE.OrthographicCamera(-FR,FR,FR,-FR,1,420);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(1,0,1);
camera.position.set(-48,52,62).add(controls.target);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.enablePan = false;
controls.minPolarAngle = .45; controls.maxPolarAngle = 1.2;
controls.minZoom = .6; controls.maxZoom = 2.4;

scene.add(new THREE.HemisphereLight(0xFBF8F4, 0xD9CFC3, .74));
const sun = new THREE.DirectionalLight(0xFFE9D2, .42);
sun.position.set(-30,60,24); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:160});
sun.shadow.bias = -.0006; sun.shadow.normalBias = .02;
scene.add(sun);

const composer = new THREE.EffectComposer(renderer);
composer.setPixelRatio(PR);
const renderPass = new THREE.RenderPass(scene,camera);
composer.addPass(renderPass);
// first-person street view: a pedestrian on the SW BART plaza corner
const streetCam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 170);
const street = {on:false, yaw:-.95, pitch:.06, tyaw:-.95, tpitch:.06, vel:0, pos:new THREE.Vector3(-11.8,1.87,12.2)};
const KEYS = new Set();
let activeCam = camera;
function aimStreet(){ streetCam.position.copy(street.pos); streetCam.rotation.set(street.pitch, street.yaw, 0, 'YXZ'); }
aimStreet();
const CLAY = 0xD97757;
const outlineAll = new THREE.OutlinePass(new THREE.Vector2(innerWidth,innerHeight), scene, camera);
Object.assign(outlineAll,{edgeStrength:2.4, edgeGlow:.9, edgeThickness:2.8});
// OutlinePass adds light by default, which vanishes on a white street; paint the edge over the scene instead.
outlineAll.overlayMaterial.blending = THREE.NormalBlending;
outlineAll.visibleEdgeColor.set(CLAY); outlineAll.hiddenEdgeColor.set(0xEDB59F);
composer.addPass(outlineAll);
const outlineFocus = new THREE.OutlinePass(new THREE.Vector2(innerWidth,innerHeight), scene, camera);
Object.assign(outlineFocus,{edgeStrength:3.2, edgeGlow:1.6, edgeThickness:4.2, pulsePeriod:0});
outlineFocus.overlayMaterial.blending = THREE.NormalBlending;
outlineFocus.visibleEdgeColor.set(CLAY); outlineFocus.hiddenEdgeColor.set(CLAY);
composer.addPass(outlineFocus);
const fxaa = new THREE.ShaderPass(THREE.FXAAShader);
composer.addPass(fxaa);

/* ================= materials + helpers ================= */
const L = c => new THREE.MeshLambertMaterial({color:c});

const CYCLE=[['mission','g',14],['mission','y',2.6],['all','r',2.6],['sixteenth','g',11],['sixteenth','y',2.6],['all','r',2.6]];
const CYCLE_LEN = CYCLE.reduce((a,c)=>a+c[2],0);
let simT = 3, paused = false;
function phaseAt(t){ t%=CYCLE_LEN; for(const c of CYCLE){ if(t<c[2]) return c; t-=c[2]; } return CYCLE[0]; }
function lightFor(sig,ph){ return ph[0]===sig ? ph[1] : 'r'; }
function paintSignals(ph){
  for (const sig of ['mission','sixteenth']){ const st=lightFor(sig,ph); for (const ls of heads[sig]) ls.forEach((d,i)=>{ d.material = ['r','y','g'][i]===st ? lamps[st] : mat.lampOff; }); }
}
function placeOnLane(l,v){
  const pos = v.s*l.dir;
  if (l.axis==='z'){ v.obj.position.set(l.c,0,pos); v.obj.rotation.y = l.dir>0 ? -Math.PI/2 : Math.PI/2; }
  else { v.obj.position.set(pos,0,l.c); v.obj.rotation.y = l.dir>0 ? 0 : Math.PI; }
}
function stepTraffic(dt,ph){
  const occ={mission:false,sixteenth:false};
  for (const l of lanes){ const half=l.axis==='z'?SZ:MX; for (const v of l.v) if (v.s+v.len/2>-half && v.s-v.len/2<half) occ[l.sig]=true; }
  for (const l of lanes){
    const other = l.sig==='mission'?'sixteenth':'mission';
    const vs=l.v; vs.sort((a,b)=>a.s-b.s);
    const st=lightFor(l.sig,ph);
    vs.forEach((v,i)=>{
      const lead = vs.length>1 ? vs[(i+1)%vs.length] : null;
      let target=v.vmax;
      if (lead){ let ls=lead.s; if (ls<=v.s) ls+=2*HALF; const gap=(ls-lead.len/2)-(v.s+v.len/2); target=Math.min(target,Math.max(0,(gap-2.2)*.9)); }
      const front=v.s+v.len/2, dist=l.stop-front;
      const mustStop = (st!=='g' && !(st==='y' && dist<3.5)) || occ[other];
      if (mustStop && dist>-.2 && dist<26) target=Math.min(target,Math.max(0,dist*.75));
      v.speed += THREE.MathUtils.clamp(target-v.speed,-7*dt,2.4*dt);
      v.s += v.speed*dt; if (v.s>HALF) v.s-=2*HALF;
      placeOnLane(l,v);
    });
  }
  for (const p of peds){
    const nx = p.s + p.dir*p.v*dt;
    const inside = q => Math.abs(q) < p.p.cross+.3;
    if (!(!inside(p.s) && inside(nx) && lightFor(p.p.sig,ph)!=='g')){ p.s = nx; if (p.s>HALF) p.s-=2*HALF; if (p.s<-HALF) p.s+=2*HALF; p.ph += dt*7; }
    const bob = Math.abs(Math.sin(p.ph))*.06;
    if (p.p.axis==='z') p.obj.position.set(p.p.c,.18+bob,p.s); else p.obj.position.set(p.s,.18+bob,p.p.c);
  }
}

/* ================= panel ================= */
const panel=document.getElementById('panel');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current=null, currentKey=null, hover=null, autoPaused=false;
const legendList=document.getElementById('legendList');
HOSTS.forEach((h,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<button aria-pressed="false"><span><span class="lg-ico">${icon(h.obj.userData.vehicle?'car':'camera')}</span>${esc(h.name)}</span><small>${h.keys.length} system${h.keys.length>1?'s':''}</small></button>`;
  li.firstChild.addEventListener('click',()=>select(i)); legendList.appendChild(li); h.leg=li.firstChild;
});
(function(){
  const ids=[...new Set(Object.values(SYSTEMS).map(s=>s.policy))];
  const depts=new Set(ids.map(id=>factBy(id).department).filter(Boolean));
  window.__stats={systems:Object.keys(SYSTEMS).length, departments:depts.size, gaps:ids.reduce((n,id)=>n+((factBy(id).vague_or_missing)||[]).length,0)};
})();

function select(i,key){
  const h=HOSTS[i]; current=h; currentKey=key||h.keys[0];
  HOSTS.forEach(x=>x.leg.setAttribute('aria-pressed',x===h));
  for (const k in cones) cones[k].forEach(c=>c.visible = k===currentKey);
  outlineFocus.selectedObjects=[h.obj];
  const tabs=document.getElementById('tabs');
  tabs.hidden = h.keys.length<2;
  tabs.innerHTML = h.keys.map(k=>`<button role="tab" aria-selected="${k===currentKey}" data-k="${k}">${esc(SYSTEMS[k].title)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>select(i,b.dataset.k));
  render(SYSTEMS[currentKey]);
  if (!paused){ paused=true; autoPaused=true; syncPause(); }
  panel.classList.add('open');
}
function render(sys){
  const f=factBy(sys.policy), src=SOURCES[sys.policy];
  const multi=current.keys.length>1;
  document.getElementById('pCat').innerHTML=`${icon(KIND_ICON[sys.kind]||'camera')} ${esc(sys.kind)}${f.department?' · '+esc(f.department):''}`;
  document.getElementById('pName').textContent = multi ? current.name : sys.title;
  document.getElementById('pPurpose').innerHTML = esc(multi ? `${sys.title}. ${f.purpose||''}` : (f.purpose||'')) + (src?`<br><a class="srclink" href="${esc(src.url)}" target="_blank" rel="noopener">${icon('link')}Read the city policy (PDF)</a>`:'');
  const H=[], M=[];
  const coll=f.collects||[];
  if (coll.length) H.push(`<div class="sec"><h3>${icon('eye')}Records</h3><ul class="list">${coll.slice(0,3).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`);
  const ret=f.retention||[];
  H.push(`<div class="sec"><h3>${icon('clock')}Kept for</h3>${ret.length?`<div class="ret">${ret.slice(0,3).map(r=>`<div><span>${esc(r.what)}</span><b>${esc(r.period)}</b></div>`).join('')}</div>`:'<p class="txt">No retention period given.</p>'}</div>`);
  const ext=f.shared_external||[];
  H.push(`<div class="sec"><h3>${icon('share')}Shared outside the city</h3>${ext.length?`<ul class="list">${ext.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="txt">No outside recipients named.</p>'}</div>`);
  const gaps=f.vague_or_missing||[];
  if (gaps.length) H.push(`<div class="sec"><h3>${icon('alert')}Gaps in the policy · ${gaps.length}</h3><div class="flags">${gaps.slice(0,2).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`);
  H.push(`<div class="sec"><div class="actions"><button class="btn" id="bComment">${icon('msg')}Comment</button><button class="btn alt" id="bRecords">${icon('file')}Request records</button></div><div id="draft" hidden><p id="draftTo"></p><textarea id="draftText" aria-label="Draft letter"></textarea><button class="btn alt" id="copy">Copy letter</button><p class="note" id="copyNote"></p></div></div>`);
  // everything else, folded away
  if (coll.length>3) M.push(`<div class="sec"><h3>Also records</h3><ul class="list">${coll.slice(3).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`);
  if (f.identifies_people) M.push(`<div class="sec"><h3>Can it identify people?</h3><p class="txt">${esc(f.identifies_people)}</p></div>`);
  if (ret.length>3) M.push(`<div class="sec"><h3>Other retention rules</h3><div class="ret">${ret.slice(3).map(r=>`<div><span>${esc(r.what)}</span><b>${esc(r.period)}</b></div>`).join('')}</div></div>`);
  const int=f.shared_internal||[];
  if (int.length) M.push(`<div class="sec"><h3>Other city departments</h3><ul class="list">${int.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if (f.outside_law_enforcement_access) M.push(`<div class="sec"><h3>Outside police access</h3><p class="txt">${esc(f.outside_law_enforcement_access)}</p></div>`);
  if (f.audit) M.push(`<div class="sec"><h3>Oversight</h3><p class="txt">${esc(f.audit)}</p></div>`);
  if (gaps.length>2) M.push(`<div class="sec"><h3>More gaps</h3><div class="flags">${gaps.slice(2).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`);
  if (f.quote) M.push(`<div class="sec"><h3>From the policy</h3><blockquote>“${esc(f.quote)}”</blockquote></div>`);
  if (M.length) H.push(`<details class="more"><summary>More from the policy</summary>${M.join('')}</details>`);
  const body=document.getElementById('pBody'); body.innerHTML=H.join(''); body.scrollTop=0;
  document.getElementById('bComment').onclick=()=>draft('comment',sys);
  document.getElementById('bRecords').onclick=()=>draft('records',sys);
  document.getElementById('copy').onclick=copyDraft;
}
function closePanel(){ panel.classList.remove('open'); current=null; if (autoPaused){ paused=false; autoPaused=false; syncPause(); } outlineFocus.selectedObjects=hover!=null?[HOSTS[hover].obj]:[]; for (const k in cones) cones[k].forEach(c=>c.visible=false); HOSTS.forEach(x=>x.leg.setAttribute('aria-pressed','false')); }
document.getElementById('close').onclick=closePanel;
addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

function draft(kind,sys){
  const f=factBy(sys.policy), src=SOURCES[sys.policy];
  const name=`${f.department||'the department'} ${src?src.label:sys.title} Surveillance Technology Policy`;
  const gaps=f.vague_or_missing||[];
  let to,text;
  if (kind==='comment'){
    to='Send as public comment to the Committee on Information Technology (COIT) or the Board of Supervisors when this policy is heard. Meeting pages: sf.gov/departments--council-information-technology-coit';
    text=`To the Committee on Information Technology and the Board of Supervisors:\n\nI live in San Francisco and I am commenting on the ${name}.\n\n`+
      (gaps.length?`The policy leaves the following unclear or unstated:\n${gaps.map(g=>`- ${g}`).join('\n')}\n\n`:'')+
      `I ask that the policy state each of these plainly, including how long each kind of data is kept and every outside party that receives it, before it is next approved or amended.\n\nThank you,\n[Your name]\n[Your neighborhood]`;
  } else {
    const ext=f.shared_external||[];
    to=`Send to ${f.department||'the department'}'s public records contact as a request under the SF Sunshine Ordinance and the California Public Records Act.`;
    text=`To the ${f.department||'department'} custodian of records:\n\nUnder the San Francisco Sunshine Ordinance (Admin Code Ch. 67) and the California Public Records Act, I request copies of:\n\n`+
      `1. The most recent annual surveillance report for the ${src?src.label:sys.title} system.\n`+
      `2. Any audit logs or audit summaries showing who accessed this system's data in the last 12 months.\n`+
      `3. Records showing data disposal under the policy's retention schedule.\n`+
      (ext.length?`4. Current contracts or data-sharing agreements with: ${ext.join('; ')}.\n`:`4. Any data-sharing agreements covering this system's data.\n`)+
      `5. Any requests for this data from agencies outside the City and County of San Francisco, and the responses.\n\nElectronic copies are fine. Please tell me if any part of this request is unclear.\n\nThank you,\n[Your name]\n[Contact]`;
  }
  document.getElementById('draftTo').textContent=to;
  document.getElementById('draftText').value=text;
  document.getElementById('copyNote').textContent='';
  document.getElementById('draft').hidden=false;
}
function copyDraft(){
  const ta=document.getElementById('draftText'), note=document.getElementById('copyNote');
  navigator.clipboard.writeText(ta.value).then(()=>{note.textContent='Copied.';}).catch(()=>{ta.select(); note.textContent='Selected. Press Ctrl+C or ⌘C to copy.';});
}

/* ================= picking + hover ================= */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(), tip=document.getElementById('tip');
const pickables=[]; HOSTS.forEach(h=>h.obj.traverse(o=>{ if(o.isMesh && !o.userData.cone) pickables.push(o); }));
let downAt=null; const _hp=new THREE.Vector3();
function hostAt(e){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,activeCam);
  const hit=ray.intersectObjects(pickables,false)[0];
  if (hit) return hit.object.userData.host;
  let best=null, bd=44;
  HOSTS.forEach((h,i)=>{ h.obj.getWorldPosition(_hp); _hp.y=h.obj.userData.vehicle?1.6:4; _hp.project(activeCam); const sx=(_hp.x+1)/2*r.width+r.left, sy=(1-_hp.y)/2*r.height+r.top; const d=Math.hypot(sx-e.clientX,sy-e.clientY); if (d<bd){bd=d;best=i;} });
  return best;
}
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if (!downAt || Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return;
  const h=hostAt(e); if (h!=null) select(h); else if (current) closePanel();
});
renderer.domElement.addEventListener('pointermove',e=>{
  if (street.on && (e.buttons&1) && downAt){ street.tyaw -= e.movementX*.0042; street.tpitch = THREE.MathUtils.clamp(street.tpitch - e.movementY*.0042, -1.0, 1.0); tip.classList.remove('on'); return; }
  const h=e.pointerType==='touch'?null:hostAt(e);
  hover = h;
  renderer.domElement.style.cursor = h!=null ? 'pointer' : 'grab';
  if (!current) outlineFocus.selectedObjects = h!=null ? [HOSTS[h].obj] : [];
  if (h!=null){ const H=HOSTS[h]; tip.innerHTML=`${esc(H.name)}<small>${H.keys.length>1?H.keys.length+' recording systems':esc(SYSTEMS[H.keys[0]].kind)} · click to see</small>`; tip.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`; tip.classList.add('on'); }
  else tip.classList.remove('on');
});
renderer.domElement.addEventListener('pointerleave',()=>{ tip.classList.remove('on'); hover=null; if(!current) outlineFocus.selectedObjects=[]; });

const viewBtn=document.getElementById('view');
function setStreet(on){
  street.on=on; activeCam = on ? streetCam : camera; sky.visible=on; scene.fog = on ? haze : null; KEYS.clear(); street.vel=0;
  PR = on ? 1 : Math.min(devicePixelRatio,1.5); renderer.setPixelRatio(PR); composer.setPixelRatio(PR); if (typeof fxaa!=='undefined') resize();
  renderPass.camera = activeCam; outlineAll.renderCamera = activeCam; outlineFocus.renderCamera = activeCam;
  controls.enabled = !on;
  viewBtn.innerHTML = `${icon(on?'map':'eye')}${on?"Bird's-eye":'Street view'}`; viewBtn.setAttribute('aria-pressed',on);
  document.getElementById('hint').textContent = on ? 'Device placement is illustrative, not real camera locations · drag to look · W/S to walk' : 'Device placement is illustrative, not real camera locations · drag to rotate';
}
viewBtn.onclick=()=>setStreet(!street.on);
setStreet(false);
const MOVE_KEYS=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown',e=>{
  if (!street.on || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k=e.key.toLowerCase(); if (!MOVE_KEYS.includes(k)) return;
  e.preventDefault(); KEYS.add(k);
});
addEventListener('keyup',e=>KEYS.delete(e.key.toLowerCase()));
addEventListener('blur',()=>KEYS.clear());
const pauseBtn=document.getElementById('pause');
function syncPause(){ pauseBtn.textContent=paused?'Resume traffic':'Pause traffic'; pauseBtn.setAttribute('aria-pressed',paused); }
pauseBtn.onclick=()=>{ paused=!paused; autoPaused=false; syncPause(); };
if (matchMedia('(prefers-reduced-motion: reduce)').matches){ paused=true; pauseBtn.textContent='Resume traffic'; pauseBtn.setAttribute('aria-pressed','true'); }

/* ================= loop ================= */
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h, fr = a<.9 ? FR*1.45 : FR;
  camera.left=-fr*a; camera.right=fr*a; camera.top=fr; camera.bottom=-fr; camera.updateProjectionMatrix();
  streetCam.aspect=a; streetCam.updateProjectionMatrix();
  renderer.setSize(w,h,false); composer.setSize(w,h);
  fxaa.material.uniforms.resolution.value.set(1/(w*PR),1/(h*PR));
}
addEventListener('resize',resize); resize();
for (let i=0;i<240;i++){ simT+=1/30; stepTraffic(1/30,phaseAt(simT)); }
const clock=new THREE.Clock(); const _ft=new THREE.Vector3(), _fd=new THREE.Vector3(), _fmin=new THREE.Vector3(-34,0,-34), _fmax=new THREE.Vector3(34,0,34);
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  if (!paused){ simT+=dt; stepTraffic(dt,phaseAt(simT)); }
  paintSignals(phaseAt(simT));
  outlineFocus.pulsePeriod = current ? 2.2 : 0;
  outlineFocus.enabled = outlineFocus.selectedObjects.length>0;
  if (current && !street.on){ current.obj.getWorldPosition(_ft); _ft.y=0; _ft.clamp(_fmin,_fmax); _fd.copy(_ft).sub(controls.target).multiplyScalar(.07); if (_fd.lengthSq()>1e-5){ controls.target.add(_fd); camera.position.add(_fd); } }
  if (street.on){
    const fwd=(KEYS.has('w')||KEYS.has('arrowup')?1:0)-(KEYS.has('s')||KEYS.has('arrowdown')?1:0);
    const turn=(KEYS.has('a')||KEYS.has('arrowleft')?1:0)-(KEYS.has('d')||KEYS.has('arrowright')?1:0);
    street.tyaw += turn*1.6*dt;
    street.vel += (fwd*4.5-street.vel)*Math.min(1,dt*7);
    if (Math.abs(street.vel)>.01){
      street.pos.x=THREE.MathUtils.clamp(street.pos.x-Math.sin(street.yaw)*street.vel*dt,-45,45);
      street.pos.z=THREE.MathUtils.clamp(street.pos.z-Math.cos(street.yaw)*street.vel*dt,-45,45);
    }
    const k=1-Math.exp(-dt*14); street.yaw+=(street.tyaw-street.yaw)*k; street.pitch+=(street.tpitch-street.pitch)*k;
    street.pos.y = 1.87 + Math.sin(clock.elapsedTime*9)*.025*Math.min(1,Math.abs(street.vel)/4.5);
    aimStreet(); sky.position.copy(streetCam.position); sky.material.uniforms.uTime.value=clock.elapsedTime;
  }
  if (!street.on) controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
